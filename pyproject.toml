[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "braid-eventgraph"
version = "0.1.0"
description = "Evidence-gated, schema-conditioned temporal graph forecasting research platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Dylan P." }]
keywords = ["graph-learning", "temporal-graphs", "knowledge-graphs", "forecasting"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dylanp12/braid"
Documentation = "https://github.com/dylanp12/braid/tree/main/docs"
Issues = "https://github.com/dylanp12/braid/issues"

[project.optional-dependencies]
models = ["numpy>=2.0", "safetensors>=0.5", "torch>=2.4"]
evaluation = ["cryptography>=43"]
dev = [
  "cryptography>=43",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "numpy>=2.0",
  "safetensors>=0.5",
  "torch>=2.4",
]

[project.scripts]
braid = "braid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/braid"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
